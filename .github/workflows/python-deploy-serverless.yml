name: Deploy

on: 
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      predeploy-script:
        required: false
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      dependency-hash-version:
        required: false
        type: string
        default: "v1"
      private-package-repo-url:
        description: The url of the private package repository you want to add to poetry. You must also specify `private-package-repo-username`
        type: string
        required: false
        default: ""
      aws-default-region:
        type: string
        required: false
        default: "us-east-1"
      python-version:
        description: The version of python to install/use
        type: string
        required: false
        default: "3.8"
      poetry-version:
        description: Version of poetry to run
        type: string
        required: false
        default: "1.4.1"
    secrets:
      private-package-repo-username:
        required: false
      private-package-repo-password:
        required: false
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  build-and-deploy:
    name: Deploy to ${{ inputs.environment }}
    
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup python and poetry and install dependencies
        uses: triaxtec/github-actions/python/setup-python-and-poetry-and-install-dependencies@v3
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}
          private-package-repo-url: ${{ inputs.private-package-repo-url }}
          private-package-repo-username: ${{ secrets.private-package-repo-username }}
          private-package-repo-password: ${{ secrets.private-package-repo-password }}
          working-directory: ${{ inputs.working-directory }}
          dependency-hash-version: ${{ inputs.dependency-hash-version }}
          exclude-dev-dependencies: true

      - name: Run Predeploy Script
        working-directory: ${{ inputs.working-directory }}
        if: ${{ inputs.predeploy-script != '' }}
        run: ${{ inputs.predeploy-script }}

      - name: Generate Requirements
        working-directory: ${{ inputs.working-directory }}
        run: poetry export -f requirements.txt -o requirements.txt --with-credentials --without-hashes

      - name: Patch requirements.txt with Gemfury credentials
        run: |
          if [ -n "${{ inputs.private-package-repo-url }}" ]; then
            PRIVATE_URL="${{ inputs.private-package-repo-url }}"
            PRIVATE_USERNAME="${{ secrets.private-package-repo-username }}"
            PRIVATE_PASSWORD="${{ secrets.private-package-repo-password }}"
            AUTH_URL=$(echo "$PRIVATE_URL" | sed "s#https://#https://${PRIVATE_USERNAME}:${PRIVATE_PASSWORD}@#")
            sed -i "1s|.*|--extra-index-url $AUTH_URL|" requirements.txt
          else
            echo "No private package repo URL provided; skipping patch."
          fi
      - name: Show requirements
        working-directory: ${{ inputs.working-directory }}
        run: cat requirements.txt

      - name: Serverless Deploy to ${{ inputs.environment }}
        uses: triaxtec/github-actions/generic/serverless-deploy@v3
        with:
          environment: ${{ inputs.environment }}
          aws-default-region: ${{ inputs.aws-default-region }}
          working-directory: ${{ inputs.working-directory }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
