name: Run Checks
description: Runs Triax's standard suite of checks (linting, mypy, safety, and unit tests). Assumes that any services needed for tests have been instantiated already.
inputs:
  module:
    description: The name of the module to run the checks on
    required: true
  additional-modules-to-lint:
    description: Additional modules to be linted using the standard ruleset (i.e. not the ones used for linting unit tests).
    required: false
    default: ""
  test-dir:
    description: The directory (or path from the project root) containing the pytests to run. Defaults to "tests".
    required: false
    default: tests
  skip-coverage-check:
    description: Set to true to disable enforcement of 100% code coverage.
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Run Black
      shell: bash
      run: poetry run black . --check

    - name: Run isort
      shell: bash
      run: poetry run isort . --check

    - name: bandit
      shell: bash
      run: poetry run bandit -r ${{ inputs.module }} -c pyproject.toml

    - name: Lint (source)
      shell: bash
      run: poetry run pylint ${{ inputs.module }} ${{ inputs.additional-modules-to-lint}}

    - name: Lint (tests)
      shell: bash
      run: poetry run pylint ${{ inputs.test-dir }} --disable="R0201,W0201,W0212,W0621,W0404,C0302"

    - name: Run safety
      shell: bash
      # 42194: Ignore safety advisory for encrypted values in sqlalchemy-utils, a feature we don't use.
      # 42050: Ignore safety advisory for more secure cookies in werkzeug, another unused feature.
      # 51668: Ignore safety advisory for sqlalchemy str(engine) including cleartext password
      # 52983: Ignore safety advisory for httpx <0.23 - we aren't effected + there are breaking changes we aren't ready for
      # 53332: (Temporary) ignore starlette because there are breaking changes in fastapi we're not ready for
      # 53310: (Temporary) ignore fastapi because there are breaking changes we're not ready for
      # 64930: (Temporary) ignore fastapi because there are breaking changes we're not ready for
      # 65213: Ignore safety advisory for pyopenssl - it's not fixed yet
      # 65293: (Temporary) ignore fastapi because there are breaking changes we're not ready for
      # 71199: (Temporary) ignore starlette because there are breaking changes we're not ready for
      # 70612: (Temporary) ignore jinja2 error because there are breaking changes we're not ready for
      # 70626: (Temporary) ignore pymongo error because we don't use pymongo and should remove it from spotr-models
      # 71083: (Temporary) need to update version of spotr-models to use new pymysql$a
      # 68094: (Temporary) ignore starlette because there are breaking changes we're not ready for
      # 71594: (Temporary) ignore werzkeug update because it requires updating starlette, fastapi, etc.
      # 70624: (Temporary) ignore issue with flask-cors because it is not yet fixed
      # 72731: (Temporary) ignore issue with flask-cors because it is not yet fixed
      # 76903: (Temporary) ignore issue with h11 because dependencies are locked to < 24
      # 79193: Ignore safety issue with deepdiff, there is no update avialable yet
      # 78279: (Temporary) ignore issue
      # 80876: (Temporary) ignore issue
      # 73725: (Temporary) ignore issue
      # 68094: (Temporary) ignore issue
      run: poetry export -f requirements.txt | poetry run safety check --bare --stdin -i 42194 -i 42050 -i 51668 -i 52983 -i 53310 -i 53332 -i 65213 -i 64930 -i 65293 -i 71199 -i 70612 -i 70626 -i 71083 -i 68094 -i 71594 -i 70624 -i 72731 -i 76903 -i 79193 -i 82332 -i 82331 -i 82196 -i 86269 -i 86909 -i 80876 -i 99546 -i 78279 -i 99546 -i SFTY-20260803-29229 -i SFTY-20260803-89041 -i SFTY-20260803-51569 -i SFTY-20260615-96125 -i SFTY-20260803-89041 -i 53269 -i SFTY-20260818-17580 -i SFTY-20260702-13000 -i SFTY-20260626-65482 -i SFTY-20260617-22444 -i SFTY-20261021-49711 -i SFTY-20261021-43268 -i SFTY-20261020-08072 -i SFTY-20261023-46878 -i SFTY-20261020-98268 -i SFTY-20261021-39022 -i SFTY-20261020-13910 -i SFTY-20261021-01028 -i SFTY-20261022-74430 -i SFTY-20261020-81509 -i SFTY-20261021-76942 -i SFTY-20260720-40232 -i SFTY-20261022-42983 -i SFTY-20261022-31475 -i SFTY-20261021-13350 -i SFTY-20261020-14050 -i SFTY-20261021-20388 -i SFTY-20261021-11431 -i SFTY-20260720-09763 -i SFTY-20260720-77502 -i SFTY-20260720-06182 -i SFTY-20260720-08227 -i SFTY-20260720-08003 -i SFTY-20260720-78690 -i SFTY-20260720-08025 -i SFTY-20260720-81593 -i SFTY-20260720-28112 -i SFTY-20261021-17221 -i SFTY-20261020-11861 -i SFTY-20261021-82408 -i SFTY-20261022-85443 -i SFTY-20261021-86543 -i SFTY-20261021-55110 -i SFTY-20261021-81271 -i SFTY-20261021-10844 -i SFTY-20261022-91260 -i SFTY-20261022-03680 -i SFTY-20261022-52573 -i SFTY-20261022-40628 -i SFTY-20261022-38655 -i SFTY-20261020-11121 -i SFTY-20261020-93855 -i SFTY-20261021-31867 -i SFTY-20261022-00971 -i SFTY-20261022-75296 -i SFTY-20261021-59163 -i SFTY-20261021-68388 -i SFTY-20261023-17584 -i SFTY-20261021-53359 -i SFTY-20261021-15476 -i SFTY-20261020-84591 -i SFTY-20260720-14393 -i SFTY-20260720-79633 -i SFTY-20260420-60812 -i SFTY-20260427-69629 -i 85681 -i SFTY-20260601-69199 -i SFTY-20260729-70233 -i 79883 -i SFTY-20260122-20373 -i 94066 -i SFTY-20260615-38625 -i SFTY-20260615-29344 -i SFTY-20260615-09692 -i SFTY-20260615-86547 -i SFTY-20261023-07051 -i SFTY-20260721-58460 -i SFTY-20260615-22503 -i SFTY-20260615-32787 -i SFTY-20260615-83407 -i 99546 -i SFTY-20260615-86827 -i 84961              

    - name: Run mypy
      shell: bash
      run: poetry run mypy --show-error-codes ${{ inputs.module }}
      
    - name: Run pytest
      shell: bash
      run: poetry run pytest --cov=${{ inputs.module }} --cov-report=term-missing ${{ inputs.test-dir }}

    - name: Enforce 100% Test Coverage
      if: ${{ inputs.skip-coverage-check == 'false' }}
      shell: bash
      run: poetry run coverage report --fail-under=100
